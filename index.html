<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Glass Pro Messenger</title>
    <!-- Подключаем Supabase -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #000000;
            --glass: rgba(255, 255, 255, 0.03);
            --glass-border: rgba(255, 255, 255, 0.1);
            --accent: #007aff;
            --text: #ffffff;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Inter', sans-serif; }

        body {
            background: var(--bg);
            background-image: radial-gradient(circle at center, #111 0%, #000 100%);
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            color: var(--text);
            overflow: hidden;
        }

        /* КОНТЕЙНЕР ПРИЛОЖЕНИЯ */
        .app-container {
            width: 95vw;
            max-width: 1000px;
            height: 85vh;
            background: var(--glass);
            backdrop-filter: blur(25px) saturate(160%);
            border: 1px solid var(--glass-border);
            border-radius: 30px;
            display: flex;
            box-shadow: 0 50px 100px rgba(0,0,0,0.9);
            overflow: hidden;
            position: relative;
        }

        /* ЭКРАН АВТОРИЗАЦИИ */
        .auth-overlay {
            position: absolute;
            inset: 0;
            background: rgba(0,0,0,0.85);
            backdrop-filter: blur(40px);
            z-index: 100;
            display: flex;
            justify-content: center;
            align-items: center;
            transition: 0.5s;
        }

        .auth-card {
            width: 380px;
            padding: 40px;
            background: rgba(255,255,255,0.05);
            border: 1px solid var(--glass-border);
            border-radius: 25px;
            text-align: center;
        }

        input {
            width: 100%;
            padding: 14px 20px;
            margin: 12px 0;
            background: rgba(255,255,255,0.05);
            border: 1px solid var(--glass-border);
            border-radius: 12px;
            color: white;
            outline: none;
            transition: 0.3s;
        }

        input:focus { border-color: var(--accent); background: rgba(255,255,255,0.1); }

        button {
            width: 100%;
            padding: 14px;
            background: var(--accent);
            color: white;
            border: none;
            border-radius: 12px;
            font-weight: 600;
            cursor: pointer;
            transition: 0.3s;
            margin-top: 10px;
        }

        button:hover { opacity: 0.8; transform: translateY(-2px); }

        /* САЙДБАР */
        .sidebar {
            width: 300px;
            border-right: 1px solid var(--glass-border);
            display: flex;
            flex-direction: column;
        }

        .sidebar-header { padding: 30px; border-bottom: 1px solid var(--glass-border); }
        .chat-item {
            padding: 20px 30px;
            display: flex;
            align-items: center;
            gap: 15px;
            background: rgba(255,255,255,0.03);
        }

        /* ОКНО ЧАТА */
        .chat-main { flex: 1; display: flex; flex-direction: column; }
        
        #messages {
            flex: 1;
            padding: 30px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .msg {
            max-width: 70%;
            padding: 12px 18px;
            border-radius: 18px;
            font-size: 14px;
            line-height: 1.4;
        }

        .m-sent { background: var(--accent); align-self: flex-end; border-bottom-right-radius: 4px; }
        .m-recv { background: rgba(255,255,255,0.08); align-self: flex-start; border-bottom-left-radius: 4px; }

        .input-area {
            padding: 25px;
            display: flex;
            gap: 12px;
            border-top: 1px solid var(--glass-border);
        }

        .hidden { display: none !important; }
    </style>
</head>
<body>

    <!-- ОКНО ВХОДА -->
    <div id="auth-screen" class="auth-overlay">
        <div class="auth-card">
            <h2 id="auth-title">Messenger</h2>
            <div id="auth-form">
                <input type="email" id="email" placeholder="Email (Gmail)">
                <input type="password" id="password" placeholder="Пароль">
                <button onclick="handleAuth()">Войти / Регистрация</button>
                <p id="status" style="font-size: 12px; margin-top: 15px; color: #888;"></p>
            </div>
            <div id="otp-form" class="hidden">
                <p style="margin-bottom: 10px;">Код отправлен на почту</p>
                <input type="text" id="otp-code" placeholder="6-значный код">
                <button onclick="verifyCode()">Подтвердить код</button>
            </div>
        </div>
    </div>

    <!-- ОСНОВНОЙ ИНТЕРФЕЙС -->
    <div class="app-container">
        <aside class="sidebar">
            <div class="sidebar-header">
                <h3>Чаты</h3>
                <small id="my-name" style="color: var(--accent);"></small>
            </div>
            <div class="chat-item">
                <div style="width:40px; height:40px; background:var(--accent); border-radius:50%; display:flex; align-items:center; justify-content:center;">#</div>
                <div><strong>Global Chat</strong><br><small style="opacity:0.5;">Общий канал</small></div>
            </div>
            <button onclick="logout()" style="margin: auto 20px 20px; background:transparent; border:1px solid rgba(255,0,0,0.3); color:red;">Выйти</button>
        </aside>

        <main class="chat-main">
            <div id="messages"></div>
            <div class="input-area">
                <input type="text" id="msgInput" placeholder="Введите сообщение...">
                <button onclick="send()" style="width: 60px; margin: 0;">→</button>
            </div>
        </main>
    </div>

<script>
    // ИНИЦИАЛИЗАЦИЯ SUPABASE С ТВОИМИ КЛЮЧАМИ
    const SUPABASE_URL = 'https://jabyevvnadbitavviklp.supabase.co';
    const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImphYnlldnZuYWRiaXRhdnZpa2xwIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzMxNDQxOTQsImV4cCI6MjA4ODcyMDE5NH0.pCLt37sW-bMhbYz1RzzgimsDgoBba47l8uF2j0i-NsE';
    const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    let currentUser = null;

    // ВХОД И РЕГИСТРАЦИЯ
    async function handleAuth() {
        const email = document.getElementById('email').value;
        const password = document.getElementById('password').value;
        const status = document.getElementById('status');
        
        status.innerText = "Загрузка...";

        // Пытаемся войти
        const { data, error } = await supabaseClient.auth.signInWithPassword({ email, password });

        if (error) {
            // Если пользователя нет — регистрируем
            const { error: signUpError } = await supabaseClient.auth.signUp({ email, password });
            if (signUpError) status.innerText = "Ошибка: " + signUpError.message;
            else {
                status.innerText = "Код отправлен на почту!";
                document.getElementById('auth-form').classList.add('hidden');
                document.getElementById('otp-form').classList.remove('hidden');
            }
        } else {
            startApp(data.user);
        }
    }

    // ПОДТВЕРЖДЕНИЕ КОДА
    async function verifyCode() {
        const email = document.getElementById('email').value;
        const token = document.getElementById('otp-code').value;
        const { data, error } = await supabaseClient.auth.verifyOtp({ email, token, type: 'signup' });
        if (error) alert(error.message);
        else startApp(data.user);
    }

    // ЗАПУСК ПРИЛОЖЕНИЯ
    async function startApp(user) {
        if (!user) return;
        currentUser = user;
        document.getElementById('auth-screen').style.display = 'none';
        document.getElementById('my-name').innerText = user.email;
        
        loadMessages();

        // Слушаем новые сообщения в реальном времени
        supabaseClient.channel('public:messages')
            .on('postgres_changes', { event: 'INSERT', schema: 'public', table: 'messages' }, payload => {
                addMessage(payload.new);
            })
            .subscribe();
    }

    // ЗАГРУЗКА СООБЩЕНИЙ
    async function loadMessages() {
        const { data } = await supabaseClient.from('messages').select('*').order('created_at', { ascending: true });
        document.getElementById('messages').innerHTML = '';
        if (data) data.forEach(addMessage);
    }

    function addMessage(msg) {
        const box = document.getElementById('messages');
        const isMy = msg.sender_email === currentUser.email;
        const div = document.createElement('div');
        div.className = `msg ${isMy ? 'm-sent' : 'm-recv'}`;
        div.innerHTML = `<small style="display:block; font-size:10px; opacity:0.5">${msg.sender_email.split('@')[0]}</small>${msg.text}`;
        box.appendChild(div);
        box.scrollTop = box.scrollHeight;
    }

    // ОТПРАВКА
    async function send() {
        const input = document.getElementById('msgInput');
        if (!input.value.trim()) return;
        
        await supabaseClient.from('messages').insert([
            { text: input.value, sender_email: currentUser.email }
        ]);
        input.value = '';
    }

    async function logout() {
        await supabaseClient.auth.signOut();
        location.reload();
    }

    // Проверка авторизации при старте
    window.onload = async () => {
        const { data } = await supabaseClient.auth.getUser();
        if (data.user) startApp(data.user);
    }
</script>
</body>
</html>
