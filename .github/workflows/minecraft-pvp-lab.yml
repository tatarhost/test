name: Minecraft PvP Lab build

on:
  push:
    branches: [minecraft-pvp-lab]
    paths:
      - "minecraft-pvp-lab/**"
      - ".github/workflows/minecraft-pvp-lab.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: minecraft-pvp-lab
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Build mod
        run: gradle --no-daemon build

      - name: Upload JAR
        uses: actions/upload-artifact@v4
        with:
          name: pvplab-fabric-1.20.4
          path: minecraft-pvp-lab/build/libs/*-1.0.0.jar
          if-no-files-found: error
          retention-days: 14
