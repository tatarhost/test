# HYPERREAL SHADERS v1.0 - shaders.properties
# -----------------------------------------------------------------------------
# Option layout, presets and loader level render state.
#
# Every option referenced here is declared in shaders/lib/settings.glsl.
# -----------------------------------------------------------------------------

# Vanilla clouds are replaced by the volumetric cloud system (lib/clouds.glsl),
# which is ray marched in the composite stage so that it is properly occluded
# by terrain.
clouds=off

# The translucent pass writes G-buffer data only. Blending is disabled so that
# the normals / material buffers are not corrupted; the compositing itself is
# done in composite1.fsh.
blend.gbuffers_water=off
blend.gbuffers_hand_water=off

# Old hand lighting would break the hand light model.
oldHandLight=false
dynamicHandLight=true

# -----------------------------------------------------------------------------
# Option screens
# -----------------------------------------------------------------------------

screen = SHADOWS AMBIENT_OCCLUSION REFLECTIONS WATER SKY CLOUDS ATMOSPHERE MATERIALS ANIMATION POST WEATHER DEBUG
screen.columns = 2

screen.SHADOWS = shadowMapResolution shadowDistance sunPathRotation SHADOW_FILTER SHADOW_PCSS SHADOW_SOFTNESS SHADOW_NORMAL_OFFSET SHADOW_DISTORTION CONTACT_SHADOWS COLORED_SHADOWS
screen.SHADOWS.columns = 2

screen.AMBIENT_OCCLUSION = SSAO SSAO_STRENGTH SSAO_RADIUS SSGI SSGI_STRENGTH

screen.REFLECTIONS = REFLECTIONS REFLECTION_QUALITY REFLECTION_ROUGH

screen.WATER = WATER_WAVES WATER_WAVE_HEIGHT WATER_WAVE_SPEED WATER_REFLECTIONS WATER_REFRACTION WATER_CAUSTICS WATER_FOG WATER_FOG_DENSITY
screen.WATER.columns = 2

screen.SKY = ATMOSPHERE_QUALITY NIGHT_SKY STARS AURORA

screen.CLOUDS = CLOUDS_VOLUMETRIC CLOUD_QUALITY CLOUD_COVERAGE CLOUD_HEIGHT CLOUD_SHADOWS CLOUD_FOG

screen.ATMOSPHERE = VOLUMETRIC_LIGHT VOLUMETRIC_QUALITY VOLUMETRIC_FOG FOG_DENSITY MORNING_FOG UNDERWATER_GODRAYS

screen.MATERIALS = PBR_RESOURCEPACK NORMAL_MAP_STRENGTH SUBSURFACE_SCATTERING EMISSIVE_BLOCKS WET_SURFACES MATERIAL_SMOOTHNESS

screen.ANIMATION = WAVING_PLANTS WAVING_LEAVES WAVING_WATER_PLANTS WIND_STRENGTH WIND_GUSTS

screen.POST = BLOOM BLOOM_STRENGTH EXPOSURE AUTO_EXPOSURE TONEMAP_MODE COLOR_GRADE SATURATION CONTRAST VIGNETTE VIGNETTE_STRENGTH CHROMATIC_ABERRATION LENS_FLARE SHARPEN FILM_GRAIN GRAIN_STRENGTH DEPTH_OF_FIELD DOF_STRENGTH DOF_FOCUS MOTION_BLUR MOTION_BLUR_STRENGTH
screen.POST.columns = 3

screen.WEATHER = WET_RAIN_SURFACES LIGHTNING_FLASH HAND_LIGHT

screen.DEBUG = DEBUG_VIEW

# -----------------------------------------------------------------------------
# Options displayed as sliders
# -----------------------------------------------------------------------------

sliders = SHADOW_SOFTNESS SSAO_STRENGTH SSAO_RADIUS SSGI_STRENGTH REFLECTION_QUALITY \
          WATER_WAVE_HEIGHT WATER_WAVE_SPEED WATER_FOG_DENSITY FOG_DENSITY \
          CLOUD_COVERAGE CLOUD_HEIGHT NORMAL_MAP_STRENGTH MATERIAL_SMOOTHNESS \
          WIND_STRENGTH BLOOM_STRENGTH EXPOSURE SATURATION CONTRAST VIGNETTE_STRENGTH \
          GRAIN_STRENGTH DOF_STRENGTH DOF_FOCUS MOTION_BLUR_STRENGTH \
          shadowMapResolution shadowDistance sunPathRotation

# -----------------------------------------------------------------------------
# Presets
# -----------------------------------------------------------------------------

profile.LOW = shadowMapResolution=1024 shadowDistance=96.0 SHADOW_FILTER=1 SHADOW_PCSS=false CONTACT_SHADOWS=false SSAO=false SSGI=false REFLECTIONS=false REFLECTION_QUALITY=16 WATER_REFLECTIONS=false WATER_REFRACTION=false WATER_CAUSTICS=false WATER_FOG=true VOLUMETRIC_LIGHT=false VOLUMETRIC_FOG=false MORNING_FOG=false UNDERWATER_GODRAYS=false CLOUDS_VOLUMETRIC=false CLOUD_QUALITY=0 CLOUD_SHADOWS=false CLOUD_FOG=false STARS=true AURORA=false ATMOSPHERE_QUALITY=1 BLOOM=true LENS_FLARE=false CHROMATIC_ABERRATION=false FILM_GRAIN=false SHARPEN=true DEPTH_OF_FIELD=false MOTION_BLUR=false AUTO_EXPOSURE=true WAVING_LEAVES=true WAVING_WATER_PLANTS=false NORMAL_MAP_STRENGTH=0.5 PBR_RESOURCEPACK=true

